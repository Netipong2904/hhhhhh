<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หาคำอังกฤษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDF1; --ink:#13233A; --muted:#5B6B7F; --tile:#FFFFFF;
  --edge:#B9C4CF; --accent:#0E7C86; --accent-ink:#FFFFFF; --warn:#B42318;
  --display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh}
main{max-width:780px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;border:0}
.modes legend{position:absolute;left:-9999px}
.modes label{cursor:pointer}
.modes input{position:absolute;opacity:0}
.modes span{display:block;padding:8px 14px;border:1.5px solid var(--edge);border-radius:8px;background:var(--tile);font-weight:500;font-size:.95rem}
.modes input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.modes input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--tile);border:1.5px solid var(--edge);border-radius:8px;padding:10px 12px}
#q{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:.12em;width:min(100%,320px)}
input[type=number]{width:84px}
button.go{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 22px;cursor:pointer;height:46px}
button.go:hover{filter:brightness(.92)}
.grow{flex:1 1 320px}

.tiles{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 6px;min-height:52px;align-items:center}
.tile{width:46px;height:52px;display:grid;place-items:center;background:var(--tile);border:2px solid var(--ink);border-radius:6px;font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;box-shadow:0 3px 0 var(--ink)}
.tile.blank{border:2px dashed var(--edge);box-shadow:none;color:var(--edge)}
.tile.more{border:0;background:none;box-shadow:none;width:auto;color:var(--muted);font-size:1.4rem;padding:0 4px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 24px}

#status{margin:0 0 12px;font-weight:500}
#status.err{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{font:inherit;font-size:.85rem;border:1.5px solid var(--edge);background:transparent;border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#results{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
#results button{font:inherit;font-size:1.02rem;background:var(--tile);border:1.5px solid var(--edge);border-radius:6px;padding:4px 11px;cursor:pointer;color:var(--ink)}
#results button:hover{border-color:var(--accent);color:var(--accent)}
#results button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}

#detail{margin-top:28px;background:var(--tile);border:2px solid var(--ink);border-radius:10px;padding:20px 22px}
#detail[hidden]{display:none}
#detail h2{font-family:var(--display);font-size:2rem;margin:0;line-height:1.1}
#detail .ph{color:var(--muted);margin:2px 0 10px}
#detail .th{font-size:1.25rem;font-weight:600;color:var(--accent);margin:0 0 12px}
#detail h3{font-size:.95rem;margin:14px 0 4px;color:var(--muted);font-weight:600}
#detail ol{margin:0;padding-left:22px}
#detail li{margin-bottom:6px}
#detail .ex{color:var(--muted);display:block}
.spin{color:var(--muted)}
@media (max-width:480px){.tile{width:38px;height:44px;font-size:1.3rem}#q{font-size:1.25rem}}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .12s}.tile:not(.blank):not(.more){animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<main>
  <h1>หาคำอังกฤษ</h1>
  <p class="lead">พิมพ์ตัวอักษรที่รู้ แล้วเลือกว่าจะให้คำขึ้นต้น ลงท้าย หรือมีตัวอักษรนั้น ถ้าไม่รู้บางตัวให้ใช้ <b>?</b> แทนหนึ่งตัวอักษร</p>

  <form id="form" autocomplete="off">
    <fieldset class="modes">
      <legend>รูปแบบการค้นหา</legend>
      <label><input type="radio" name="mode" value="starts" checked><span>ขึ้นต้นด้วย</span></label>
      <label><input type="radio" name="mode" value="ends"><span>ลงท้ายด้วย</span></label>
      <label><input type="radio" name="mode" value="contains"><span>มีตัวอักษร</span></label>
      <label><input type="radio" name="mode" value="pattern"><span>ตามรูปแบบ</span></label>
    </fieldset>

    <div class="row">
      <div class="field grow">
        <label for="q">ตัวอักษร</label>
        <input type="text" id="q" maxlength="20" spellcheck="false" autocapitalize="off" placeholder="เช่น str" aria-describedby="hint">
      </div>
      <div class="field">
        <label for="min">ยาวอย่างน้อย</label>
        <input type="number" id="min" min="1" max="30" inputmode="numeric">
      </div>
      <div class="field">
        <label for="max">ไม่เกิน</label>
        <input type="number" id="max" min="1" max="30" inputmode="numeric">
      </div>
      <div class="field">
        <label for="sort">เรียงตาม</label>
        <select id="sort">
          <option value="freq">คำที่พบบ่อยก่อน</option>
          <option value="az">A–Z</option>
          <option value="len">สั้นไปยาว</option>
        </select>
      </div>
    </div>
  </form>

  <div class="tiles" id="tiles" aria-hidden="true"></div>
  <p class="hint" id="hint"></p>

  <p id="status" role="status" aria-live="polite"></p>
  <div class="chips" id="chips" role="group" aria-label="กรองตามความยาวคำ"></div>
  <ul id="results"></ul>

  <section id="detail" hidden aria-live="polite"></section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const form=$('form'), q=$('q'), tiles=$('tiles'), hint=$('hint'), statusEl=$('status'),
        chips=$('chips'), results=$('results'), detail=$('detail');

  const HINTS = {
    starts:  ['เช่น str','คำที่ขึ้นต้นด้วยตัวอักษรที่พิมพ์ (ใช้ ? แทนตัวที่ไม่รู้ได้)'],
    ends:    ['เช่น tion','คำที่ลงท้ายด้วยตัวอักษรที่พิมพ์'],
    contains:['เช่น ght','คำที่มีตัวอักษรชุดนี้อยู่ตรงไหนก็ได้'],
    pattern: ['เช่น a??le','ใช้ ? แทนหนึ่งตัวอักษร และ * แทนกี่ตัวก็ได้ เช่น a??le จะได้ apple, ankle']
  };
  const BUILD = {
    starts:  s => s + '*',
    ends:    s => '*' + s,
    contains:s => '*' + s + '*',
    pattern: s => s
  };

  let words = [];          // ผลลัพธ์ทั้งหมดหลังกรองความยาว
  let lenFilter = null;    // ความยาวที่เลือกจาก chip
  let reqId = 0;

  const mode = () => form.elements.mode.value;

  function clean(raw, m){
    const allowed = m === 'pattern' ? /[^a-z?*]/g : /[^a-z?]/g;
    return raw.toLowerCase().replace(allowed, '');
  }

  function renderTiles(){
    const m = mode(), s = clean(q.value, m);
    tiles.replaceChildren();
    const add = (cls, text) => { const d=document.createElement('div'); d.className='tile '+cls; d.textContent=text; tiles.appendChild(d); };
    if (m==='ends' || m==='contains') add('more','…');
    for (const ch of s){
      if (ch==='?') add('blank','?');
      else if (ch==='*') add('more','…');
      else add('', ch);
    }
    if (m==='starts') add('more','…');
    if (m==='contains') add('more','…');
    if (!s && m!=='pattern') tiles.replaceChildren();
  }

  function renderHint(){
    const [ph, text] = HINTS[mode()];
    q.placeholder = ph;
    hint.id = 'hint';
    hint.textContent = text;
  }

  function sorted(list){
    const s = $('sort').value, out = list.slice();
    if (s==='az') out.sort((a,b)=>a.localeCompare(b));
    else if (s==='len') out.sort((a,b)=>a.length-b.length || a.localeCompare(b));
    return out; // freq = ลำดับเดิมจาก API
  }

  function renderChips(){
    chips.replaceChildren();
    const lens = [...new Set(words.map(w=>w.length))].sort((a,b)=>a-b);
    if (lens.length < 2) { lenFilter = null; return; }
    const mk = (label, val) => {
      const b=document.createElement('button'); b.type='button'; b.textContent=label;
      b.setAttribute('aria-pressed', String(lenFilter===val));
      b.onclick=()=>{ lenFilter=val; renderChips(); renderResults(); };
      chips.appendChild(b);
    };
    mk('ทุกความยาว', null);
    lens.forEach(n => mk(n+' ตัว', n));
  }

  function renderResults(){
    results.replaceChildren();
    const list = sorted(lenFilter ? words.filter(w=>w.length===lenFilter) : words);
    const frag = document.createDocumentFragment();
    for (const w of list){
      const li=document.createElement('li'), b=document.createElement('button');
      b.type='button'; b.textContent=w; b.onclick=()=>showDetail(w,b);
      li.appendChild(b); frag.appendChild(li);
    }
    results.appendChild(frag);
    statusEl.className='';
    statusEl.textContent = list.length ? `พบ ${list.length.toLocaleString('th-TH')} คำ` + (words.length>=1000?' (API ส่งสูงสุด 1,000 คำ ลองเพิ่มตัวอักษรให้เจาะจงขึ้น)':'') : '';
  }

  async function search(){
    const m = mode(), s = clean(q.value, m);
    if (q.value !== s) q.value = s;
    detail.hidden = true;
    if (!s.replace(/[?*]/g,'')){
      reqId++; words = []; lenFilter = null;
      statusEl.className=''; statusEl.textContent='';
      chips.replaceChildren(); results.replaceChildren();
      return;
    }
    const min = parseInt($('min').value)||0, max = parseInt($('max').value)||Infinity;
    if (min > max){ statusEl.className='err'; statusEl.textContent='ความยาวต่ำสุดต้องไม่มากกว่าความยาวสูงสุด'; return; }

    const my = ++reqId;
    statusEl.className=''; statusEl.textContent='กำลังค้นหา...';
    chips.replaceChildren(); results.replaceChildren();
    try{
      const url = 'https://api.datamuse.com/words?max=1000&md=pf&sp=' + encodeURIComponent(BUILD[m](s));
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if (my !== reqId) return;
      const seen = new Set();
      const POS = ['n','v','adj','adv'];
      const MIN_FREQ = 0.1; // ครั้งต่อล้านคำ: เพิ่มค่าให้กรองเข้มขึ้น ลดค่าให้เก็บคำหายากมากขึ้น
      words = data.filter(d=>{
        const w = d.word, tags = d.tags || [];
        if (!/^[a-z]+$/i.test(w) || seen.has(w)) return false;
        // ต้องมีชนิดคำที่ API รู้จัก (ตัดชื่อเฉพาะล้วนและคำที่ไม่รู้จัก; apple, mark ที่เป็นทั้งชื่อและนามยังอยู่)
        if (!tags.some(t=>POS.includes(t))) return false;
        // ต้องมีความถี่การใช้ถึงขั้นต่ำ
        const f = tags.find(t=>t.startsWith('f:'));
        if (!f || parseFloat(f.slice(2)) < MIN_FREQ) return false;
        // ไม่มีสระเลย เช่น tv, nbc, ltd ถือเป็นตัวย่อ
        if (!/[aeiouy]/i.test(w)) return false;
        seen.add(w);
        return w.length>=min && w.length<=max;
      }).map(d=>d.word);
      lenFilter = null;
      if (!words.length){ statusEl.textContent='ไม่พบคำที่ตรงเงื่อนไข ลองลดเงื่อนไขหรือเปลี่ยนรูปแบบการค้นหา'; return; }
      renderChips(); renderResults();
    }catch(e){
      if (my !== reqId) return;
      statusEl.className='err';
      statusEl.textContent='เชื่อมต่อ API ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วกดค้นหาอีกครั้ง';
    }
  }

  async function showDetail(word, btn){
    results.querySelectorAll('[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
    btn.setAttribute('aria-current','true');
    detail.hidden=false;
    detail.replaceChildren();
    const h=document.createElement('h2'); h.textContent=word; detail.appendChild(h);
    const wait=document.createElement('p'); wait.className='spin'; wait.textContent='กำลังโหลดความหมาย...'; detail.appendChild(wait);
    detail.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});

    const [dict, tr] = await Promise.allSettled([
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word)).then(r=>{ if(!r.ok) throw 0; return r.json(); }),
      fetch('https://api.mymemory.translated.net/get?langpair=en|th&q='+encodeURIComponent(word)).then(r=>r.json())
    ]);
    if (!btn.hasAttribute('aria-current')) return; // ผู้ใช้เลือกคำอื่นไปแล้ว
    wait.remove();

    const el=(tag,text,cls)=>{const n=document.createElement(tag); if(text) n.textContent=text; if(cls) n.className=cls; return n;};

    const entry = dict.status==='fulfilled' ? dict.value[0] : null;
    const phon = entry && (entry.phonetic || (entry.phonetics.find(p=>p.text)||{}).text);
    if (phon) detail.appendChild(el('p',phon,'ph'));

    if (tr.status==='fulfilled' && tr.value.responseData && tr.value.responseData.translatedText){
      const t = tr.value.responseData.translatedText;
      if (t.toLowerCase()!==word.toLowerCase()) detail.appendChild(el('p',t,'th'));
    }

    if (!entry){
      detail.appendChild(el('p','ไม่พบความหมายภาษาอังกฤษของคำนี้ในพจนานุกรมออนไลน์'));
      return;
    }
    for (const m of entry.meanings.slice(0,4)){
      detail.appendChild(el('h3', m.partOfSpeech));
      const ol=document.createElement('ol');
      for (const d of m.definitions.slice(0,3)){
        const li=document.createElement('li'); li.appendChild(document.createTextNode(d.definition));
        if (d.example) li.appendChild(el('span','“'+d.example+'”','ex'));
        ol.appendChild(li);
      }
      detail.appendChild(ol);
    }
  }

  let timer;
  const searchSoon = () => { clearTimeout(timer); timer = setTimeout(search, 300); };

  form.addEventListener('submit', e=>{ e.preventDefault(); clearTimeout(timer); search(); });
  form.addEventListener('change', e=>{ if (e.target.name==='mode'){ renderHint(); renderTiles(); searchSoon(); } });
  q.addEventListener('input', ()=>{ renderTiles(); searchSoon(); });
  $('min').addEventListener('input', searchSoon);
  $('max').addEventListener('input', searchSoon);
  $('sort').addEventListener('change', ()=>{ if (words.length) renderResults(); });

  renderHint(); renderTiles();
})();
</script>
</body>
</html>
